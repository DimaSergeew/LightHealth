# LightHealth — mob HP feedback
# style: numeric | hearts | bar | custom
# language: en | ru | es | zh

language: en
style: bar

display:
  hologram: true
  damage-numbers: true
  actionbar: true
  # Opt-in: keeping this off avoids treating every mob like a boss.
  bossbar: false

# Show each player one short tip after their first successful hit.
onboarding:
  enabled: true

hologram:
  # When true, damage-triggered holograms skip 0-damage hits only (not other channels).
  only-when-damaged: true
  hide-after-ticks: 40
  view-distance: 16
  # Extra height above the mob. Mounted holograms sit on the attachment point;
  # rideable mobs / players use world-space follow instead (same offset above the head).
  y-offset: 0.35

# Show HP while looking at a mob (raycast, blocked by solid blocks)
look-at:
  enabled: true
  range: 12
  interval-ticks: 4
  show:
    hologram: true
    actionbar: true
    bossbar: false


damage-numbers:
  duration-ticks: 28
  rise-per-tick: 0.045
  view-distance: 16
  base-scale: 1.15
  crit-scale: 1.5
  # Min ticks between environmental (fire/poison/cactus) numbers. 0 = off. Player hits always show.
  env-interval-ticks: 10
  tiers:
    - max: 2
      format: "<#B0B0B0>-<amount></#B0B0B0>"
    - max: 4
      format: "<white>-<amount></white>"
    - max: 8
      format: "<#FFEB3B>-<amount></#FFEB3B>"
    - max: 14
      format: "<#FFA726><bold>-<amount></bold></#FFA726>"
    - max: 22
      format: "<#FF7043><bold>-<amount></bold></#FF7043>"
    - max: 99999
      format: "<#FF1744><bold>-<amount></bold></#FF1744>"
  crit:
    enabled: true
    symbol: "✦"
    format: "<gradient:#FFE082:#FF6D00><bold><symbol> <amount></bold></gradient>"

actionbar:
  duration-ticks: 40

bossbar:
  hide-after-ticks: 70
  min-max-health: 0
  # static color if dynamic-color: false
  color: GREEN
  overlay: NOTCHED_10
  dynamic-color: true
  # HP% thresholds for bossbar color + text bar color
  high-percent: 50
  mid-percent: 25

# Used when style: custom (and as fallback)
# Placeholders: <health> <max> <percent> <amount> <name> <hearts> <bar> <symbol>
# look-at-* templates are used when damage is 0 (no -<amount>)
format:
  hologram: "<bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
  damage: "<#FF5252>-<amount></#FF5252>"
  actionbar: "<white><name></white> <bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray> <red>-<amount></red>"
  bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>  <red>-<amount></red>"
  look-at-actionbar: "<white><name></white> <bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
  look-at-bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"

styles:
  hearts:
    full: "❤"
    empty: "❤"
    hp-per-heart: 2.0
    max-icons: 10
    hologram: "<hearts> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    actionbar: "<white><name></white> <hearts> <white><health></white><dark_gray>/</dark_gray><gray><max></gray> <red>-<amount></red>"
    bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>  <red>-<amount></red>"
    look-at-actionbar: "<white><name></white> <hearts> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    look-at-bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
  bar:
    filled: "█"
    empty: "░"
    length: 12
    hologram: "<bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    actionbar: "<white><name></white> <bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray> <red>-<amount></red>"
    bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>  <red>-<amount></red>"
    look-at-actionbar: "<white><name></white> <bar> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    look-at-bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
  numeric:
    hologram: "<red>❤</red> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    actionbar: "<white><name></white> <red>❤</red> <white><health></white><dark_gray>/</dark_gray><gray><max></gray> <red>-<amount></red>"
    bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>  <red>-<amount></red>"
    look-at-actionbar: "<white><name></white> <red>❤</red> <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"
    look-at-bossbar: "<white><name></white>  <white><health></white><dark_gray>/</dark_gray><gray><max></gray>"

blacklist:
  entities:
    - ARMOR_STAND
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
    - MARKER
    - TEXT_DISPLAY
    - BLOCK_DISPLAY
    - ITEM_DISPLAY
    - INTERACTION
    - VILLAGER
  worlds: []
  worlds-as-whitelist: false

players: false
