site_name: LightHealth
site_description: Lightweight mob health bar and damage indicator plugin with look-at inspect for Paper, Purpur, and Folia.
site_url: https://dimasergeew.github.io/LightHealth/
repo_url: https://github.com/DimaSergeew/LightHealth
repo_name: DimaSergeew/LightHealth
edit_uri: edit/main/docs/
copyright: MIT · bedepay

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  logo: assets/icon.png
  favicon: assets/icon.png
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/information-outline
      tip: material/lightbulb-on-outline
      warning: material/alert-outline

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DimaSergeew/LightHealth
      name: GitHub
    - icon: fontawesome/solid/book
      link: https://dimasergeew.github.io/LightHealth/
      name: Documentation

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Commands: commands.md
      - Languages: languages.md
  - Configure:
      - Config: config.md
      - Look-at: look-at.md
  - Why LightHealth?: why-lighthealth.md
  - FAQ: faq.md
